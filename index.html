
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PowerWise Egypt - نظام ذكي لمتابعة استهلاك الكهرباء">
  <title>PowerWise Egypt | لوحة التحكم</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PowerWise Egypt</h1>
    <p>لوحة ذكية لمتابعة استهلاك الكهرباء</p>
  </header>

  <main>
    <section class="welcome">
      <h2>أهلاً بيك 👋</h2>
      <p>تابع استهلاك الكهرباء ورصيد عدادك من مكان واحد.</p>
    </section>

    <section class="dashboard">
      <article class="stat-card">
        <span class="card-icon">💳</span>
        <h3>رصيد العداد</h3>
        <p class="stat-value">250 جنيه</p>
        <span class="stat-note">رصيد تجريبي</span>
      </article>

      <article class="stat-card">
        <span class="card-icon">⚡</span>
        <h3>استهلاك اليوم</h3>
        <p class="stat-value">8.5 كيلو وات ساعة</p>
        <span class="stat-note">استهلاك تجريبي</span>
      </article>

      <article class="stat-card">
        <span class="card-icon">✅</span>
        <h3>حالة العداد</h3>
        <p class="stat-value">متصل</p>
        <span class="stat-note">حالة توضيحية فقط</span>
      </article>
    </section>
  </main>
</body>
</html>
